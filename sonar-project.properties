# SonarQube Cloud Project Configuration
sonar.projectKey=Jonathan510T_Kitchen-Quest
sonar.organization=jonathan510t
sonar.projectName=Kitchen-Quest
sonar.projectVersion=1.0

# Source and Test file paths
sonar.sources=backend,frontend
sonar.tests=frontend/tests,tests

# Exclusions
sonar.exclusions=frontend/tests/**,backend/migrations/**,**/*.pyc,**/__pycache__/**,**/.venv/**,**/.git/**,**/test-case-deliverables/**,**/*.xlsx,**/*.csv,**/*.tsv,**/*.md,**/*.pdf
sonar.test.inclusions=frontend/tests/**,tests/**

# Source encoding
sonar.sourceEncoding=UTF-8

# Python version compatibility
sonar.python.version=3.11,3.12,3.13,3.14
